<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Ibrahim's Hub</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1424; --card:#151b30; --card2:#1b2240; --border:#28304d;
  --blue:#3b82f6; --cyan:#22d3ee; --green:#22c55e; --gold:#fbbf24; --purple:#a855f7;
  --red:#ef4444; --pink:#ec4899; --orange:#fb923c;
  --text:#e8edff; --muted:#8b95b8;
  --grad:linear-gradient(135deg,#3b82f6 0%,#a855f7 100%);
  --grad-green:linear-gradient(135deg,#22c55e 0%,#22d3ee 100%);
  --grad-gold:linear-gradient(135deg,#fbbf24 0%,#fb923c 100%);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:var(--text); line-height:1.5; min-height:100vh;
  padding-bottom:84px; overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 90% -10%, rgba(168,85,247,0.16), transparent 60%),
    radial-gradient(800px 500px at -10% 0%, rgba(59,130,246,0.16), transparent 55%),
    var(--bg);
}
.wrap{max-width:560px;margin:0 auto;}

/* ===== HEADER HUD ===== */
.hud{ position:sticky; top:0; z-index:100; padding:14px 16px 12px;
  background:rgba(10,14,26,0.82); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); }
.hud-row{ display:flex; align-items:center; gap:12px; }
.lvl-badge{ width:52px; height:52px; border-radius:16px; background:var(--grad);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-weight:900; flex-shrink:0; box-shadow:0 6px 18px rgba(168,85,247,0.4);
  position:relative; }
.lvl-badge .lv{ font-size:0.5rem; letter-spacing:1px; opacity:0.85; margin-top:-2px; }
.lvl-badge .num{ font-size:1.3rem; line-height:1; }
.hud-mid{ flex:1; min-width:0; }
.hud-name{ font-size:0.95rem; font-weight:800; display:flex; align-items:center; gap:8px; }
.hud-rank{ font-size:0.7rem; color:var(--gold); font-weight:800; letter-spacing:0.5px; text-transform:uppercase;}
.xp-track{ height:9px; background:#0b1020; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:6px; }
.xp-fill{ height:100%; background:var(--grad); border-radius:10px; width:0%; transition:width 0.5s cubic-bezier(.3,1.3,.6,1); box-shadow:0 0 12px rgba(59,130,246,0.6);}
.xp-text{ font-size:0.62rem; color:var(--muted); margin-top:3px; font-weight:700; letter-spacing:0.3px;}
.streak-chip{ display:flex; flex-direction:column; align-items:center; background:#1a1304;
  border:1px solid #4d3a0a; border-radius:14px; padding:6px 12px; flex-shrink:0;}
.streak-chip .s-num{ font-size:1.25rem; font-weight:900; color:var(--gold); line-height:1;}
.streak-chip .s-lab{ font-size:0.52rem; font-weight:800; letter-spacing:0.5px; color:#b08512; text-transform:uppercase; margin-top:2px;}

/* ===== TAB PANELS ===== */
.panel{ display:none; padding:16px; animation:fade 0.25s ease; }
.panel.active{ display:block; }
@keyframes fade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

/* ===== BOTTOM NAV ===== */
.nav{ position:fixed; bottom:0; left:0; right:0; z-index:120;
  display:flex; background:rgba(13,18,34,0.94); backdrop-filter:blur(16px);
  border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;}
.nav-btn{ flex:1; min-width:0; background:none; border:none; cursor:pointer; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 1px;
  font-size:0.55rem; font-weight:800; letter-spacing:0; white-space:nowrap; transition:color 0.2s; }
.nav-btn .ic{ font-size:1.3rem; filter:grayscale(0.5); transition:transform 0.2s, filter 0.2s;}
.nav-btn.active{ color:var(--text); }
.nav-btn.active .ic{ filter:none; transform:translateY(-2px) scale(1.12); }
.nav-btn.active::after{ content:''; position:absolute; }

/* ===== CARDS ===== */
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; }
.card.glow{ box-shadow:0 0 0 1px rgba(59,130,246,0.4), 0 8px 30px rgba(59,130,246,0.12); }
.sec-title{ font-size:0.72rem; font-weight:900; letter-spacing:1.2px; text-transform:uppercase;
  color:var(--muted); margin:22px 4px 10px; display:flex; align-items:center; gap:8px;}
.sec-title:first-child{ margin-top:4px; }
.card-h{ font-size:1rem; font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:9px;}
.card-sub{ font-size:0.8rem; color:var(--muted); margin-bottom:12px; }

/* ===== HERO BANNER ===== */
.hero{ background:var(--grad); border-radius:var(--radius); padding:18px 18px; margin-bottom:16px;
  position:relative; overflow:hidden; }
.hero::after{ content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  background:radial-gradient(circle,rgba(255,255,255,0.25),transparent 70%); }
.hero h2{ font-size:1.15rem; font-weight:900; letter-spacing:-0.3px; }
.hero p{ font-size:0.82rem; opacity:0.92; margin-top:3px; position:relative; }

/* ===== CHECK ITEMS ===== */
.task{ display:flex; align-items:center; gap:13px; padding:14px 13px; margin-bottom:9px;
  background:var(--card); border:1px solid var(--border); border-radius:14px; cursor:pointer;
  transition:transform 0.1s, background 0.2s, border-color 0.2s; }
.task:active{ transform:scale(0.985); }
.task.done{ background:rgba(34,197,94,0.08); border-color:rgba(34,197,94,0.45); }
.cbox{ width:28px; height:28px; border-radius:9px; border:2px solid #3a4566;
  flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1rem;
  font-weight:900; color:transparent; transition:all 0.18s; }
.task.done .cbox{ background:var(--green); border-color:var(--green); color:#04220f; transform:rotate(0); }
.t-emoji{ font-size:1.3rem; flex-shrink:0; }
.t-body{ flex:1; min-width:0; }
.t-title{ font-size:0.9rem; font-weight:700; }
.task.done .t-title{ color:var(--muted); text-decoration:line-through; }
.t-note{ font-size:0.72rem; color:var(--muted); margin-top:1px; }
.t-xp{ font-size:0.62rem; font-weight:900; color:var(--gold); background:#1a1304; border:1px solid #4d3a0a;
  padding:3px 7px; border-radius:8px; flex-shrink:0; letter-spacing:0.3px; }
.task.done .t-xp{ opacity:0.4; }
.t-now{ font-size:0.56rem; font-weight:900; letter-spacing:0.5px; background:rgba(239,68,68,0.15);
  color:#fca5a5; padding:3px 7px; border-radius:8px; flex-shrink:0; }
.task.done .t-now{ display:none; }

/* progress + done banner */
.pbar{ height:10px; background:#0b1020; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:4px 0 8px;}
.pfill{ height:100%; background:var(--grad-green); width:0%; transition:width 0.4s; border-radius:10px;}
.count{ font-size:0.72rem; font-weight:800; color:var(--muted); margin-bottom:12px;}
.done-banner{ display:none; text-align:center; font-size:0.9rem; font-weight:800; color:#86efac;
  background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.4); border-radius:12px; padding:15px; margin-top:4px;}
.mission.alldone .done-banner{ display:block; animation:pop 0.4s ease;}
@keyframes pop{0%{transform:scale(0.9);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ===== BUTTONS / LINKS ===== */
.btn{ display:inline-flex; align-items:center; gap:7px; border:none; cursor:pointer;
  border-radius:12px; font-weight:800; font-size:0.8rem; padding:10px 16px; color:white;
  text-decoration:none; transition:transform 0.1s, opacity 0.2s;}
.btn:active{ transform:scale(0.96);}
.btn-grad{ background:var(--grad);}
.btn-red{ background:linear-gradient(135deg,#ef4444,#ec4899);}
.btn-green{ background:var(--grad-green); color:#04220f;}
.btn-ghost{ background:var(--card2); border:1px solid var(--border); color:var(--text);}
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

/* ===== CHAPTER / LIST ROWS ===== */
.chap{ display:flex; align-items:center; gap:12px; padding:13px; border-radius:14px; margin-bottom:9px;
  background:var(--card); border:1px solid var(--border); cursor:pointer; transition:transform 0.1s;}
.chap:active{ transform:scale(0.99);}
.chap.locked{ opacity:0.5; }
.chap.current{ border-color:var(--blue); box-shadow:0 0 0 1px rgba(59,130,246,0.35);}
.chap.cleared{ border-color:rgba(34,197,94,0.4); }
.chap-num{ width:38px; height:38px; border-radius:11px; background:var(--card2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.95rem; flex-shrink:0;}
.chap.cleared .chap-num{ background:var(--green); color:#04220f; border-color:var(--green);}
.chap.current .chap-num{ background:var(--grad); }
.chap-body{ flex:1; min-width:0;}
.chap-t{ font-size:0.88rem; font-weight:700;}
.chap-meta{ font-size:0.7rem; color:var(--muted); margin-top:2px;}
.chap-tag{ font-size:0.58rem; font-weight:900; padding:3px 8px; border-radius:8px; letter-spacing:0.4px; flex-shrink:0;}
.tag-now{ background:rgba(59,130,246,0.18); color:#93c5fd;}
.tag-done{ background:rgba(34,197,94,0.18); color:#86efac;}
.tag-soon{ background:var(--card2); color:var(--muted);}
.tag-late{ background:rgba(239,68,68,0.18); color:#fca5a5;}

/* badges */
.badges{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.badge{ aspect-ratio:1; border-radius:14px; background:var(--card2); border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center; padding:4px;}
.badge.earned{ background:linear-gradient(160deg,rgba(251,191,36,0.18),rgba(168,85,247,0.12)); border-color:#4d3a0a;}
.badge .b-ic{ font-size:1.5rem; filter:grayscale(1) opacity(0.4);}
.badge.earned .b-ic{ filter:none;}
.badge .b-n{ font-size:0.54rem; font-weight:800; color:var(--muted); line-height:1.1;}
.badge.earned .b-n{ color:var(--text);}

/* exercise */
.ex{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:9px; overflow:hidden;}
.ex.done{ border-color:rgba(34,197,94,0.4);}
.ex-head{ display:flex; align-items:center; gap:11px; padding:13px;}
.ex-check{ width:26px;height:26px;border-radius:8px;border:2px solid #3a4566;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent;cursor:pointer;transition:all .15s;}
.ex.done .ex-check{ background:var(--green); border-color:var(--green); color:#04220f;}
.ex-info{ flex:1; min-width:0; cursor:pointer;}
.ex-name{ font-size:0.86rem; font-weight:700;}
.ex.done .ex-name{ color:var(--muted);}
.ex-sets{ font-size:0.7rem; color:var(--cyan); font-weight:700; margin-top:1px;}
.ex-arrow{ color:var(--muted); font-size:0.8rem; transition:transform 0.2s; cursor:pointer;}
.ex.open .ex-arrow{ transform:rotate(90deg);}
.ex-detail{ display:none; padding:0 13px 13px 50px; }
.ex.open .ex-detail{ display:block;}
.ex-how{ font-size:0.8rem; color:#c3cbe8; line-height:1.6; margin-bottom:9px;}

/* pills */
.pill{ font-size:0.62rem; font-weight:900; padding:4px 10px; border-radius:20px; letter-spacing:0.3px;}
.pill-blue{ background:rgba(59,130,246,0.16); color:#93c5fd;}
.pill-green{ background:rgba(34,197,94,0.16); color:#86efac;}
.pill-gold{ background:rgba(251,191,36,0.16); color:#fcd34d;}
.pill-purple{ background:rgba(168,85,247,0.16); color:#d8b4fe;}
.pill-red{ background:rgba(239,68,68,0.16); color:#fca5a5;}

/* toast */
#toast{ position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(30px);
  background:var(--card2); border:1px solid var(--border); color:var(--text); font-weight:800; font-size:0.85rem;
  padding:12px 18px; border-radius:14px; z-index:300; opacity:0; pointer-events:none; transition:all 0.35s;
  box-shadow:0 10px 40px rgba(0,0,0,0.5); max-width:90%; text-align:center;}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
#toast.levelup{ background:var(--grad-gold); color:#3a2400; border:none;}

/* modal */
.modal-bg{ position:fixed; inset:0; background:rgba(5,7,15,0.82); backdrop-filter:blur(4px); z-index:400;
  display:none; align-items:flex-end; justify-content:center;}
.modal-bg.show{ display:flex;}
.modal{ background:var(--bg2); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%;
  max-width:560px; max-height:92vh; overflow-y:auto; padding:20px 18px calc(28px + env(safe-area-inset-bottom)); animation:slideup 0.3s ease;}
@keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
.modal-x{ float:right; background:var(--card2); border:1px solid var(--border); color:var(--text); width:34px;height:34px;
  border-radius:50%; font-size:1.1rem; font-weight:900; cursor:pointer;}
.quiz-q{ font-size:1.05rem; font-weight:800; margin:8px 0 16px; line-height:1.4;}
.quiz-opt{ display:block; width:100%; text-align:left; background:var(--card); border:2px solid var(--border);
  border-radius:13px; padding:13px 15px; margin-bottom:10px; color:var(--text); font-size:0.9rem; font-weight:600; cursor:pointer; transition:all 0.15s;}
.quiz-opt:active{ transform:scale(0.99);}
.quiz-opt.correct{ background:rgba(34,197,94,0.18); border-color:var(--green);}
.quiz-opt.wrong{ background:rgba(239,68,68,0.18); border-color:var(--red);}
.quiz-opt:disabled{ cursor:default;}
.quiz-explain{ font-size:0.82rem; color:#c3cbe8; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:13px; margin-bottom:14px; line-height:1.6; display:none;}
.quiz-explain.show{ display:block;}

.note-input{ width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px;
  color:var(--text); padding:12px; font-size:0.85rem; font-family:inherit; resize:vertical; min-height:80px; margin-top:8px;}
.stepper{ display:flex; align-items:center; gap:10px;}
.step-btn{ width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:1.2rem;font-weight:900;cursor:pointer;}
.step-val{ font-size:1.1rem; font-weight:900; min-width:30px; text-align:center;}
small.muted{ color:var(--muted); font-size:0.72rem;}
a.inline{ color:var(--cyan); font-weight:700; text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-row">
      <div class="lvl-badge"><div class="lv">LVL</div><div class="num" id="hudLevel">1</div></div>
      <div class="hud-mid">
        <div class="hud-name">Ibrahim <span class="hud-rank" id="hudRank">Rookie</span></div>
        <div class="xp-track"><div class="xp-fill" id="hudXpFill"></div></div>
        <div class="xp-text" id="hudXpText">0 / 100 XP</div>
      </div>
      <div class="streak-chip"><div class="s-num" id="hudStreak">0</div><div class="s-lab">🔥 streak</div></div>
    </div>
  </div>

  <!-- PANELS -->
  <div id="p-today" class="panel active"></div>
  <div id="p-algebra" class="panel"></div>
  <div id="p-train" class="panel"></div>
  <div id="p-soccer" class="panel"></div>
  <div id="p-basketball" class="panel"></div>
  <div id="p-mind" class="panel"></div>
  <div id="p-read" class="panel"></div>
  <div id="p-deen" class="panel"></div>

</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <button class="nav-btn active" data-tab="today"   onclick="switchTab('today',this)"><span class="ic">🎯</span>Today</button>
  <button class="nav-btn"        data-tab="algebra" onclick="switchTab('algebra',this)"><span class="ic">🧮</span>Algebra</button>
  <button class="nav-btn"        data-tab="train"   onclick="switchTab('train',this)"><span class="ic">⚡</span>Train</button>
  <button class="nav-btn"        data-tab="soccer"  onclick="switchTab('soccer',this)"><span class="ic">⚽</span>Soccer</button>
  <button class="nav-btn"        data-tab="basketball" onclick="switchTab('basketball',this)"><span class="ic">🏀</span>Ball</button>
  <button class="nav-btn"        data-tab="mind"    onclick="switchTab('mind',this)"><span class="ic">🧠</span>Mind</button>
  <button class="nav-btn"        data-tab="read"    onclick="switchTab('read',this)"><span class="ic">📖</span>Read</button>
  <button class="nav-btn"        data-tab="deen"    onclick="switchTab('deen',this)"><span class="ic">☪️</span>Deen</button>
</div>

<div id="toast"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>

<script>
/* ============================================================
   CORE ENGINE — storage, XP, levels, streak, HUD, helpers
   ============================================================ */
function dateKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loadJSON(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?def:v; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* XP — awarded map keyed by action id so nothing double-counts */
function getAwarded(){ return loadJSON('ib_xp_awarded',{}); }
function totalXP(){ return Object.values(getAwarded()).reduce((s,v)=>s+v,0); }
function award(id,amt){ const a=getAwarded(); if(a[id]==null){ a[id]=amt; saveJSON('ib_xp_awarded',a);} }
function revoke(id){ const a=getAwarded(); if(a[id]!=null){ delete a[id]; saveJSON('ib_xp_awarded',a);} }

const RANKS=['Rookie','Prospect','Starter','Baller','Cracked','Bucket','Goated','Elite','Legend','GOAT'];
function levelInfo(xp){ let lvl=1, rem=xp; while(rem >= lvl*100){ rem-=lvl*100; lvl++; } return {level:lvl, into:rem, need:lvl*100}; }
function rankFor(lvl){ return RANKS[Math.min(lvl-1, RANKS.length-1)]; }

/* daily checks (date-scoped) */
function dayStore(){ return loadJSON('ib_day_'+dateKey(),{}); }
function setDayStore(s){ saveJSON('ib_day_'+dateKey(),s); }
/* persistent checks (chapters, suras, lectures, books) */
function doneStore(){ return loadJSON('ib_done',{}); }
function setDoneStore(s){ saveJSON('ib_done',s); }
function isDone(id){ return !!doneStore()[id]; }

/* completed-day set for streak */
function completedDays(){ return loadJSON('ib_completedDays',[]); }
function setCompletedDays(a){ saveJSON('ib_completedDays',a); }
function computeStreak(){
  const set=new Set(completedDays()); let c=0; const d=new Date();
  if(!set.has(dateKey(d))) d.setDate(d.getDate()-1);
  while(set.has(dateKey(d))){ c++; d.setDate(d.getDate()-1); }
  return c;
}

/* HUD */
let LAST_LEVEL = loadJSON('ib_lastLevel',1);
function updateHUD(){
  const xp=totalXP(); const li=levelInfo(xp);
  document.getElementById('hudLevel').textContent=li.level;
  document.getElementById('hudRank').textContent=rankFor(li.level);
  document.getElementById('hudXpFill').style.width=Math.round(li.into/li.need*100)+'%';
  document.getElementById('hudXpText').textContent=li.into+' / '+li.need+' XP  ·  '+xp+' total';
  document.getElementById('hudStreak').textContent=computeStreak();
  if(li.level>LAST_LEVEL){ toast('⚡ LEVEL UP →  Lv '+li.level+'  '+rankFor(li.level),true); }
  LAST_LEVEL=li.level; saveJSON('ib_lastLevel',li.level);
}

let toastTimer=null;
function toast(msg,levelup){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='show'+(levelup?' levelup':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.className=''; },2200);
}

/* ===== generic toggles ===== */
// daily task; key unique per task; isMission flags streak-relevant items
function toggleDaily(key,xp,el,isMission){
  const s=dayStore(); s[key]=!s[key]; setDayStore(s);
  const id='daily:'+dateKey()+':'+key;
  if(s[key]){ award(id,xp); xpPop(el,xp);} else revoke(id);
  if(el) el.classList.toggle('done',!!s[key]);
  if(isMission) refreshMission();
  updateHUD();
}
function dailyOn(key){ return !!dayStore()[key]; }

// persistent done (chapters/suras/lectures/books)
function toggleDone(id,xp,el){
  const s=doneStore(); s[id]=!s[id]; setDoneStore(s);
  if(s[id]){ award('done:'+id,xp); xpPop(el,xp);} else revoke('done:'+id);
  updateHUD();
  return !!s[id];
}

function xpPop(el,xp){ if(!el) return; toast('+'+xp+' XP'); }

/* ===== tab switching ===== */
function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  if(btn) btn.classList.add('active');

let QZ={ch:null,i:0,score:0,answered:false};
function startQuiz(ch){ QZ={ch,i:0,score:0,answered:false}; renderQuiz(); }
function renderQuiz(){
  const bank=QUIZ[QZ.ch]; const item=bank[QZ.i];
  let opts=''; item.opts.forEach((o,i)=>{ opts+=`<button class="quiz-opt" id="qo${i}" onclick="answerQuiz(${i})">${o}</button>`; });
  openModal(`
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div style="font-size:0.7rem;font-weight:900;letter-spacing:1px;color:var(--muted)">CH ${QZ.ch} · Q${QZ.i+1} of ${bank.length} · Score ${QZ.score}</div>
    <div class="quiz-q">${item.q}</div>
    <div id="qOpts">${opts}</div>
    <div class="quiz-explain" id="qExplain"></div>
    <button class="btn btn-grad" id="qNext" style="width:100%;justify-content:center;display:none" onclick="nextQuiz()">${QZ.i<bank.length-1?'Next →':'See results'}</button>
  `);
}
function answerQuiz(choice){
  if(QZ.answered) return; QZ.answered=true;
  const bank=QUIZ[QZ.ch]; const item=bank[QZ.i];
  document.querySelectorAll('.quiz-opt').forEach((b,i)=>{ b.disabled=true; if(i===item.a) b.classList.add('correct'); if(i===choice&&choice!==item.a) b.classList.add('wrong'); });
  if(choice===item.a){ QZ.score++; const id='quiz:'+QZ.ch+':'+QZ.i; if(getAwarded()[id]==null){ award(id,5);} updateHUD(); }
  const ex=document.getElementById('qExplain'); ex.innerHTML=(choice===item.a?'✅ <b>Correct.</b> ':'❌ <b>Not quite.</b> ')+item.ex; ex.classList.add('show');
  document.getElementById('qNext').style.display='flex';
}
function nextQuiz(){
  const bank=QUIZ[QZ.ch];
  if(QZ.i<bank.length-1){ QZ.i++; QZ.answered=false; renderQuiz(); }
  else{
    const pct=Math.round(QZ.score/bank.length*100); const passed=pct>=80;
    if(passed){ const id='quizpass:'+QZ.ch; if(getAwarded()[id]==null){ award(id,50);} }
    updateHUD();
    openModal(`<button class="modal-x" onclick="closeModal()">✕</button>
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:3rem">${passed?'🏆':'💪'}</div>
        <h2 style="font-size:1.4rem;font-weight:900;margin:6px 0">${QZ.score} / ${bank.length}</h2>
        <p style="color:#c3cbe8;font-size:0.9rem">${passed?'Passed! You actually get this. +50 XP':'Almost — rewatch the video and run it back. No shame, that’s the rep.'}</p>
        <div class="btn-row" style="justify-content:center;margin-top:16px">
          <button class="btn btn-ghost" onclick="startQuiz(${QZ.ch})">↻ Retry</button>
          ${passed?`<button class="btn btn-green" onclick="toggleChapterIfNeeded(${QZ.ch})">Mark chapter cleared</button>`:''}
        </div></div>`);
  }
}
function toggleChapterIfNeeded(n){ if(!isDone('ch'+n)){ toggleDone('ch'+n,150); toast('🧮 Chapter '+n+' cleared! +150 XP',true);} closeModal(); switchTab('algebra',document.querySelector('[data-tab=algebra]')); }

      <div style="font-size:2rem">📿</div></div>
      <div class="pbar" style="margin-top:8px"><div class="pfill" style="width:${Math.round(memorized/SURAS.length*100)}%"></div></div></div>
    <div class="card"><div class="card-h">👤 Tutor sessions (1:1, tajweed)</div>
      <div class="card-sub">Your in-person tutor handles tajweed correction. Log each session and what you covered.</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px"><div style="font-size:1.8rem;font-weight:900;color:var(--gold)">${tutor.sessions}</div><small class="muted">sessions logged</small>
      <button class="btn btn-green" style="margin-left:auto" onclick="logTutor()">+ Log session</button></div>
      <textarea class="note-input" id="tutorNote" placeholder="What did you work on with the tutor?">${tutor.note}</textarea>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="saveTutorNote()">Save notes</button></div>
    <div class="sec-title">📖 Memorization tracker — tap when solid w/ tajweed</div>
    ${grid}
    <div class="sec-title">🕌 Islam lectures <span class="pill pill-green">Bayyinah · YouTube</span></div>
    <div class="card-sub" style="margin:-4px 4px 10px">Watch 2–3×/week. Each has a quick assignment so it’s active, not passive.</div>
    <div class="btn-row" style="margin-bottom:12px"><a class="btn btn-grad" href="https://bayyinah.tv" target="_blank">Open Bayyinah TV</a></div>
    ${lecs}`;
}
function logTutor(){ const t=loadJSON('ib_tutor',{sessions:0,note:''}); t.sessions++; saveJSON('ib_tutor',t); award('tutor:'+Date.now(),25); toast('👤 Session logged · +25 XP'); renderDeen(); updateHUD(); }
function saveTutorNote(){ const t=loadJSON('ib_tutor',{sessions:0,note:''}); t.note=document.getElementById('tutorNote').value; saveJSON('ib_tutor',t); toast('Saved'); }
RENDERERS.push(renderDeen);

/* DATA_AND_RENDERERS */

// ===== BOOT =====
renderAll();
</script>
</body>
</html>
